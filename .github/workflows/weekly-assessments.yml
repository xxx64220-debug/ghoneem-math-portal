name: Weekly assessment database regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  weekly-assessments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/june-review-runtime --ignore-scripts --no-audit --no-fund
      - run: node tests/weekly_assessments_db.cjs
