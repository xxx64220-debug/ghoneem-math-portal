name: Password recovery approval
on:
  pull_request:
    paths:
      - 'supabase/functions/password-recovery/**'
      - 'supabase/migrations/*student_password_recovery.sql'
      - 'web/password-*'
      - 'web/admin.html'
      - 'tests/password_recovery*'
      - '.github/workflows/password-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests/english-runtime
      - run: npm ci --prefix tests/june-review-runtime
      - run: node --test tests/password_recovery.test.cjs tests/password_recovery_admin.test.cjs
      - run: node tests/password_recovery_db.cjs
