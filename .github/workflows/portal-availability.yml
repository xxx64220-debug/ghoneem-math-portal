name: Portal availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      delivery_test:
        description: 'Send a labelled synthetic failure/recovery notification to the approved recipient'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-availability.yml'
      - 'supabase/migrations/**'
      - 'database-releases/**'
      - 'scripts/check-portal-availability.mjs'
      - 'scripts/run-portal-availability.mjs'
      - 'scripts/alert-portal-availability.mjs'
      - 'scripts/test-portal-alert-delivery.mjs'
      - 'tests/portal-availability.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portal-availability.yml'
      - 'supabase/migrations/**'
      - 'database-releases/**'
      - 'scripts/check-portal-availability.mjs'
      - 'scripts/run-portal-availability.mjs'
      - 'scripts/alert-portal-availability.mjs'
      - 'scripts/test-portal-alert-delivery.mjs'
      - 'tests/portal-availability.test.mjs'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('portal-availability-pr-{0}', github.event.pull_request.number) || 'portal-availability' }}
  cancel-in-progress: false
jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/portal-availability.test.mjs
  probe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'xxx64220-debug/ghoneem-math-portal'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test failure and recovery without external requests
        run: node --test tests/portal-availability.test.mjs
      - name: Check portal, Auth and database twice
        id: health
        continue-on-error: true
        run: node scripts/run-portal-availability.mjs "$RUNNER_TEMP/portal-availability.json"
      - name: Reconcile failure and recovery alerts
        if: ${{ !cancelled() && steps.health.outcome != 'skipped' }}
        env:
          # Deployment and recipient approved by the owner on 2026-11-14.
          # Set the repository variable to false to pause external issue alerts.
          PORTAL_AVAILABILITY_ALERTS_ENABLED: ${{ vars.PORTAL_AVAILABILITY_ALERTS_ENABLED != 'false' }}
          PORTAL_AVAILABILITY_RECIPIENT: xxx64220-debug
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/alert-portal-availability.mjs "$RUNNER_TEMP/portal-availability.json"
      - name: Test approved notification delivery with synthetic reports
        if: ${{ !cancelled() && (inputs.delivery_test == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[availability-alert-delivery-test]'))) }}
        env:
          PORTAL_AVAILABILITY_ALERTS_ENABLED: ${{ vars.PORTAL_AVAILABILITY_ALERTS_ENABLED != 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/test-portal-alert-delivery.mjs
      - name: Preserve failed health-check conclusion
        if: ${{ !cancelled() && steps.health.outcome == 'failure' }}
        run: exit 1
