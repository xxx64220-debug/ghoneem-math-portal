<style>
:root{
  --navy:#14243E; --navy-2:#1D3155; --gold:#C9A227; --gold-soft:#F3E8C4;
  --paper:#FBFAF7; --line:#E2E0D9; --ink:#171A1F; --muted:#6B7280;
  --ok:#1F7A4D; --bad:#B0342C;
  --accent:var(--gold);            /* overwritten per track */
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;
     -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;color:var(--navy)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
input{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);
      background:#fff;width:100%}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hidden{display:none !important}

.btn{background:var(--navy);color:#fff;padding:11px 20px;border-radius:var(--r);font-weight:600}
.btn:hover{background:var(--navy-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:var(--r);font-weight:500}
.btn-ghost:hover{border-color:var(--navy)}
.btn-accent{background:var(--accent);color:var(--navy)}

/* ---------- masthead ---------- */
header.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{font-family:Fraunces,serif;font-weight:700;color:var(--navy);font-size:17px}
.brand span{display:block;font:500 10.5px/1 'IBM Plex Mono',monospace;color:var(--muted);
            letter-spacing:.14em;margin-top:3px}
.spacer{flex:1}
.track-chip{font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;padding:7px 11px;
            border-radius:99px;background:var(--gold-soft);color:var(--navy)}

/* ---------- login ---------- */
.login{max-width:380px;margin:11vh auto;padding:0 20px}
.login h1{font-size:31px;margin-bottom:6px}
.login p.sub{color:var(--muted);margin-bottom:26px;font-size:14.5px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.err{color:var(--bad);font-size:14px;margin-top:12px;min-height:20px}

/* ---------- track chooser: the signature ---------- */
.chooser{padding:52px 20px 70px}
.chooser h1{font-size:33px;margin-bottom:5px}
.chooser .sub{color:var(--muted);margin-bottom:32px}
.tracks{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr))}
.track-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:26px 24px 22px;text-align:left;overflow:hidden;transition:transform .18s,box-shadow .18s}
.track-card::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--tc)}
.track-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px -14px rgba(20,36,62,.35)}
.track-card .code{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:var(--muted)}
.track-card h2{font-size:27px;margin:9px 0 3px}
.track-card .meta{color:var(--muted);font-size:14px}
.track-card .go{margin-top:18px;font-weight:600;color:var(--navy)}
.track-card .go::after{content:" →"}

/* ---------- exam list ---------- */
.list{padding:38px 20px 70px}
.exam-row{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:17px 20px;margin-bottom:11px}
.exam-row h3{font-size:17px}
.exam-row .meta{font-size:13.5px;color:var(--muted);margin-top:3px}
.badge{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;padding:5px 9px;
  border-radius:5px;background:#F1F0EC;color:var(--muted)}
.badge.done{background:#E7F2EC;color:var(--ok)}

/* ---------- exam runner ---------- */
.runbar{position:sticky;top:62px;z-index:15;background:#fff;border-bottom:1px solid var(--line)}
.runbar .wrap{display:flex;align-items:center;gap:14px;height:54px}
.clock{font:500 20px/1 'IBM Plex Mono',monospace;color:var(--navy);font-variant-numeric:tabular-nums}
.clock.warn{color:var(--bad)}
.saving{font-size:12.5px;color:var(--muted);min-width:64px}

.palette{display:flex;flex-wrap:wrap;gap:6px;padding:16px 0 4px}
.pal{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:#fff;
  font:500 13px/1 'IBM Plex Mono',monospace;color:var(--muted)}
.pal.answered{background:var(--navy);border-color:var(--navy);color:#fff}
.pal.current{outline:2.5px solid var(--accent);outline-offset:1px}
.pal.flagged::after{content:"";position:absolute;margin:-15px 0 0 11px;width:6px;height:6px;
  border-radius:50%;background:var(--gold)}

.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;margin:14px 0}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.qnum{font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--muted)}
.stem{font-size:17px;line-height:1.6;margin-bottom:18px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;
  border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:9px}
.choice:hover{border-color:var(--navy)}
.choice.sel{border-color:var(--navy);background:#F5F7FA;box-shadow:inset 0 0 0 1px var(--navy)}
.choice .k{font:600 13px/1.5 'IBM Plex Mono',monospace;color:var(--muted);flex:none;width:18px}
.choice.sel .k{color:var(--navy)}
.gridin{max-width:230px}
.gridin-hint{font-size:12.5px;color:var(--muted);margin-top:7px}
.nav{display:flex;gap:10px;align-items:center;margin:18px 0 60px}

.fig{margin:4px 0 18px;overflow-x:auto}
.fig svg{max-width:100%;height:auto;display:block}
.fig-table table{border-collapse:collapse;font-size:14.5px}
.fig-table th,.fig-table td{border:1px solid var(--line);padding:7px 12px;text-align:center}
.fig-table th{background:#F4F5F7;font-weight:600;color:var(--navy)}

/* ---------- review ---------- */
.score{background:var(--navy);color:#fff;border-radius:16px;padding:30px 28px;margin:26px 0 20px}
.score .big{font-family:Fraunces,serif;font-size:47px;line-height:1;color:#fff}
.score .lbl{font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;
  color:var(--gold-soft);margin-bottom:11px}
.score .raw{color:#C9D2E0;margin-top:9px;font-size:14.5px}
.rev{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:var(--r);padding:20px 22px;margin-bottom:11px}
.rev.right{border-left-color:var(--ok)}
.rev.wrong{border-left-color:var(--bad)}
.rev .tag{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.13em}
.rev.right .tag{color:var(--ok)} .rev.wrong .tag{color:var(--bad)}
.rev .ans{margin-top:11px;font-size:14.5px}
.rev .exp{margin-top:11px;padding-top:13px;border-top:1px solid var(--line);
  font-size:14.5px;color:#39404B}
.locked{background:var(--gold-soft);border-radius:var(--r);padding:17px 19px;font-size:14.5px}

footer.pg{border-top:1px solid var(--line);padding:19px 0;text-align:center;
  font-size:12.5px;color:var(--muted)}
footer.pg b{color:var(--navy)}

/* ============================ CONFIG ============================ */
const SB_URL = 'https://wfhurjyouemahvkcfkdz.supabase.co';
const SB_KEY = 'sb_publishable_FIUSELOTsAQaH8dQ6oF-ow_CcISJV5-';
const EMAIL_DOMAIN = 'students.ghoneem-math.com';
/* ================================================================ */

const sb = supabase.createClient(SB_URL, SB_KEY);
const fnBase = SB_URL + '/functions/v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let ST = { tracks: [], track: null, run: null, idx: 0, flags: new Set(), timer: null };

/* ---- call an Edge Function with the caller's JWT ---- */
async function fn(name, { method = 'GET', body = null, qs = '', headers = {} } = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('vLogin'); throw new Error('signed_out'); }
  const res = await fetch(`${fnBase}/${name}${qs}`, {
    method,
    headers: { 'Authorization': `Bearer ${session.access_token}`,
               'Content-Type': 'application/json', 'apikey': SB_KEY, ...headers },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, json };
}

function show(id) {
  ['vLogin','vTracks','vList','vRun','vReview'].forEach(v => $(v).classList.toggle('hidden', v !== id));
  $('top').classList.toggle('hidden', id === 'vLogin');
  $('switchBtn').classList.toggle('hidden', !(ST.tracks.length > 1 && id !== 'vTracks'));
  $('chip').classList.toggle('hidden', !ST.track || id === 'vTracks');
  window.scrollTo(0, 0);
}
function math(el) {
  if (window.renderMathInElement) renderMathInElement(el, {
    delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
    throwOnError: false,
  });
}
const FRIENDLY = {

/* ========================== EXAM RUNNER ========================== */
async function startExam(examId, untimed=false) {
  const { ok, json } = await fn('start-attempt', { method: 'POST', body: { exam_id: examId, untimed } });
  if (!ok) { alert(friendly(json.error)); return openTrack(ST.track); }
  json.exam.id=examId;
  ST.run = json; ST.idx = 0; ST.flags = new Set();
  // Server time is authoritative; measure the offset once and count from it.
  ST.skew = new Date(json.attempt.server_now).getTime() - Date.now();
  restorePending(); startClock(); renderPalette(); renderQ(); show('vRun');
}

function startClock() {
  clearInterval(ST.timer);
  if(ST.run.attempt.deadline_at==='infinity'){ $('clock').textContent='No time limit';$('clock').classList.remove('warn');return; }
  const dl = new Date(ST.run.attempt.deadline_at).getTime();
  const tick = () => {
    const left = Math.floor((dl - (Date.now() + ST.skew)) / 1000);
    if (left <= 0) { clearInterval(ST.timer); $('clock').textContent = '00:00'; return submitExam(true); }
    const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
    $('clock').textContent = (h ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    $('clock').classList.toggle('warn', left < 300);
  };
  tick(); ST.timer = setInterval(tick, 1000);
}

function renderPalette() {
  const qs = ST.run.questions;
  $('palette').innerHTML = qs.map((q, i) =>
    `<button class="pal ${q.response != null && q.response !== '' ? 'answered' : ''}
      ${i === ST.idx ? 'current' : ''} ${ST.flags.has(q.id) ? 'flagged' : ''}"
      data-i="${i}" style="position:relative">${i + 1}</button>`).join('');
  $('palette').querySelectorAll('.pal').forEach(b =>
    b.onclick = () => { captureInput(); ST.idx = +b.dataset.i; renderQ(); renderPalette(); });
  const done = qs.filter(q => q.response != null && q.response !== '').length;
  $('progress').textContent = `${done} of ${qs.length} answered`;
}

function renderQ() {
  const q = ST.run.questions[ST.idx];
  let body;
  if (q.type === 'mcq') {
    body = (q.choices || []).map(c => `<button class="choice ${q.response === c.key ? 'sel' : ''}"
      data-k="${esc(c.key)}"><span class="k">${esc(c.key)}</span><span class="choice-text">${esc(c.text)}</span></button>`).join('');
  } else {
    body = `<input class="gridin" id="gin" inputmode="text" autocomplete="off"
      placeholder="Your answer" value="${esc(q.response ?? '')}">
      <div class="gridin-hint">Fractions and decimals are both accepted — 3/4 or 0.75.</div>`;
  }
  $('qcard').innerHTML = `<div class="qhead"><span class="qnum">QUESTION ${ST.idx + 1}</span>
    <span class="qnum" style="color:var(--accent)">${esc(q.topic || '')}</span></div>
    <div class="stem">${esc(q.stem)}</div>${figure(q.assets)}${body}`;
  math($('qcard'));

  $('qcard').querySelectorAll('.choice').forEach(b =>
    b.onclick = () => save(q, b.dataset.k));
  const gin = $('gin');
  if (gin) {
    gin.oninput = () => save(q, gin.value.trim());
  }
  $('prevBtn').disabled = ST.idx === 0;
  $('nextBtn').disabled = ST.idx === ST.run.questions.length - 1;
  $('flagBtn').textContent = ST.flags.has(q.id) ? 'Unflag' : 'Flag';
}

/* Lane A — the answer goes straight to Postgres under RLS. No function call,
   so autosave never waits on a cold start. The policy refuses it the moment
   the attempt is submitted or past its deadline. */
const pending = new Map();
let flushing = null, submitting = false;
function pendingKey(){return 'ghoneem-answers-'+ST.run.attempt.id;}
function persistPending(){try{localStorage.setItem(pendingKey(),JSON.stringify([...pending]));}catch{}}
function restorePending(){
 pending.clear();
 try{for(const [id,value] of JSON.parse(localStorage.getItem(pendingKey())||'[]')){
 const q=ST.run.questions.find(q=>q.id===id);if(q){q.response=value;pending.set(id,value);}}}catch{}
 flushAnswers();
}
function captureInput(){const input=$('gin');if(input&&ST.run)save(ST.run.questions[ST.idx],input.value.trim());}
function save(q,value){
 if(submitting||!ST.run||q.response===value)return;
 q.response=value;pending.set(q.id,value);persistPending();renderPalette();
 if(q.type==='mcq')renderQ();
 $('saving').textContent='Saving…';flushAnswers();
}
async function flushAnswers(){
 if(flushing)return flushing;
 if(!ST.run||!pending.size)return true;
 flushing=(async()=>{
  while(pending.size){
   const [id,value]=pending.entries().next().value;
   try{
    const {error}=await sb.from('attempt_answers').upsert({attempt_id:ST.run.attempt.id,question_id:id,response:value===''?null:value},{onConflict:'attempt_id,question_id'});
    if(error)throw error;
    if(pending.get(id)===value)pending.delete(id);persistPending();
   }catch{$('saving').textContent='Not synced — retrying when connected';return false;}
  }
  $('saving').textContent='All answers saved';return true;
 })();
 try{return await flushing;}finally{flushing=null;}
}
setInterval(()=>{if(ST.run&&!submitting&&!$('vRun').classList.contains('hidden'))flushAnswers();},10000);
window.addEventListener('online',()=>flushAnswers());

$('prevBtn').onclick = () => { if (ST.idx > 0) { captureInput(); ST.idx--; renderQ(); renderPalette(); } };
$('nextBtn').onclick = () => { if (ST.idx < ST.run.questions.length - 1) { captureInput(); ST.idx++; renderQ(); renderPalette(); } };
$('flagBtn').onclick = () => {
  const id = ST.run.questions[ST.idx].id;
  ST.flags.has(id) ? ST.flags.delete(id) : ST.flags.add(id);
  renderQ(); renderPalette();
};
$('finishBtn').onclick = () => submitExam(false);

async function submitExam(auto) {
 if(submitting||!ST.run)return;
 captureInput();
 const blank=ST.run.questions.filter(q=>q.response==null||q.response==='').length;
 if(!auto&&!confirm(blank?`${blank} question(s) are blank. Submit your exam?`:'Submit your exam? You cannot change answers afterwards.'))return;
 submitting=true;$('finishBtn').disabled=true;$('finishBtn').textContent='Submitting…';
 try{
  const saved=await flushAnswers();
  if(!saved&&!auto){alert('Some answers have not synced. Keep this page open and reconnect before submitting.');return;}
  const {ok,status,json}=await fn('submit-attempt',{method:'POST',body:{attempt_id:ST.run.attempt.id},headers:{'Idempotency-Key':ST.run.attempt.id}});
  if(ok||(status===409&&json.result)){
   const current=DASH.exams.find(e=>e.id===ST.run.exam.id);
   const next=current?.exam_set_code?DASH.exams.find(e=>e.exam_set_code===current.exam_set_code&&e.module_number===current.module_number+1):null;
   clearInterval(ST.timer);pending.clear();persistPending();paintReview(ok?json:json.result,next?.id||null);ST.run=null;
  }else{alert(friendly(json.error));}
 }catch{$('saving').textContent='Submission not confirmed. Reconnect and press Submit again.';}
 finally{submitting=false;$('finishBtn').disabled=false;$('finishBtn').textContent='Submit exam';}
}

/* ============================ REVIEW ============================ */
async function openReview(attemptId) {
  const { ok, json } = await fn('attempt-review',
    { qs: `?attempt_id=${encodeURIComponent(attemptId)}` });
  if (ok) return paintReview(json);
  alert(friendly(json.error));
}

function paintReview(r,nextExamId=null) {
  const s = r.attempt || r.score || {};
  const scaled = s.scaled_score, raw = s.score, total = s.total;
  let html = `<div class="score">
      <div class="lbl">${esc((r.exam && r.exam.title) || 'RESULT')}</div>
      <div class="big">${scaled != null ? scaled : (raw != null ? raw + '/' + total : 'Awaiting grading')}</div>
      <div class="raw">${scaled != null && raw != null ? `${raw} of ${total} correct` : ''}
        ${s.status === 'expired' ? ' · time expired' : ''}</div></div>`;

  const excluded=(r.items||[]).filter(it=>it.correct?.void).length;
  if(excluded)html+=`<div class="locked">${r.items.length} questions were presented. ${excluded} defective questions are excluded; your score is based on ${total} valid questions.</div>`;
  if (!r.review_open) {
    html += `<div class="locked">${raw == null ? '<b>Submission saved.</b> Awaiting a verified answer key; your answers are recorded and no mark has been assigned.' : '<b>Answers open later.</b> Your score is recorded.'}
      ${s.review_unlocks_at?`Worked answers unlock on ${esc(new Date(s.review_unlocks_at).toLocaleString())}.`:'Your instructor controls when worked answers are released.'}</div>`;
  } else {
    html += (r.items || []).map((it, i) => `<div class="rev ${it.correct?.void ? 'excluded' : it.is_correct ? 'right' : 'wrong'}">
      <span class="tag">${i + 1} · ${it.correct?.void ? 'EXCLUDED FROM SCORING' : it.is_correct ? 'CORRECT' : 'INCORRECT'}</span>
      <div class="stem" style="margin:9px 0 0;font-size:16px">${esc(it.stem)}</div>
      ${figure(it.assets)}
      ${it.type==='mcq'?`<div class="review-choices">${(it.choices||[]).map(c=>`<div class="review-choice"><b>${esc(c.key)}.</b><span>${esc(c.text)}</span></div>`).join('')}</div>`:''}
      <div class="ans"><div><b>Your answer:</b> ${esc(fmt(it.response)) || '<i>blank</i>'}</div><div><b>Correct:</b> ${esc(fmt(it.correct))}</div></div>
      ${it.explanation ? `<div class="exp">${esc(it.explanation)}</div>` : ''}</div>`).join('');
  }
  html += `<div class="nav" style="margin-top:22px">${nextExamId?'<button class="btn" id="nextModuleBtn">Start Module 2</button>':''}<button class="btn" id="backBtn">Back to exams</button></div>`;
  $('vReview').innerHTML = html;
  math($('vReview'));
  $('backBtn').onclick = () => openTrack(ST.track);
  if($('nextModuleBtn'))$('nextModuleBtn').onclick=()=>startExam(nextExamId);
  show('vReview');
}
/* ---------------- figure rendering ----------------
   Questions carry either a `figspec` (a drawing spec: parallel lines,
   transversals and labelled angle arcs) or `html` (a data table).
   Both come from your own bank through the service-role importer, never
   from a student, so the table markup is injected rather than escaped.

   NOTE ON SCALE: these specs are schematic. Bank items 0 and 5 share
   identical coordinates but read 61 deg and 74 deg, so the drawing is a
   template and the label is authoritative — same as the printed SAT,
   where figures are not drawn to scale. */
function ent(t) {
  const d = document.createElement('textarea');
  d.innerHTML = String(t ?? '');
  return d.value;
}
function drawFig(spec) {
  const H = spec.h || 230, W = 360;
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="figure">`;
  for (const L of (spec.lines || [])) {
    o += `<line x1="${L[0]}" y1="${L[1]}" x2="${L[2]}" y2="${L[3]}"
            stroke="var(--navy)" stroke-width="1.8" stroke-linecap="round"/>`;
    if (L.length >= 7 && L[4]) {
      o += `<text x="${L[5]}" y="${L[6]}" font-size="13" font-style="italic"
              fill="var(--navy)">${esc(ent(L[4]))}</text>`;
    }
  }
  for (const A of (spec.arcs || [])) {
    const [cx, cy, d1x, d1y, d2x, d2y] = A;
    const t = A.length > 6 ? ent(A[6]) : '';
    const r = A.length > 7 ? A[7] : 26;
    const sx = cx + r * d1x, sy = cy + r * d1y;
    const ex = cx + r * d2x, ey = cy + r * d2y;
    const sweep = (d1x * d2y - d1y * d2x) > 0 ? 1 : 0;
    o += `<path d="M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${r} ${r} 0 0 ${sweep}
            ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none"
            stroke="var(--gold)" stroke-width="1.6"/>`;
    let bx = d1x + d2x, by = d1y + d2y;
    let m = Math.hypot(bx, by);
    if (m < 1e-6) { bx = -d1y; by = d1x; m = 1; }
    bx /= m; by /= m;
    o += `<text x="${(cx + (r + 15) * bx).toFixed(1)}" y="${(cy + (r + 15) * by).toFixed(1)}"
            font-size="12.5" fill="var(--navy)" text-anchor="middle"
            dominant-baseline="middle">${esc(t)}</text>`;
  }
  if (spec.extra) o += cleanMarkup(ent(spec.extra));
  return o + '</svg>';
}
function cleanMarkup(markup){
 const doc=new DOMParser().parseFromString(markup,'text/html');
 const tags=new Set('svg g path line rect circle ellipse polygon polyline text tspan defs marker table thead tbody tr th td caption colgroup col div span p br b i strong em sup sub'.split(' '));
 const attrs=new Set('viewBox xmlns d x y x1 y1 x2 y2 cx cy r rx ry width height points fill stroke stroke-width transform text-anchor dominant-baseline font-size font-style colspan rowspan scope role aria-label'.toLowerCase().split(' '));
 for(const el of [...doc.body.querySelectorAll('*')]){
  if(!tags.has(el.localName)){el.remove();continue;}
  for(const a of [...el.attributes])if(!attrs.has(a.name.toLowerCase())||/url\s*\(|javascript:/i.test(a.value))el.removeAttribute(a.name);
 }
 return doc.body.innerHTML;
}
function figure(a) {
  if (!a) return '';
  let out = '';
  const figures=Array.isArray(a.figure)?a.figure:[a.figure];
  for(const src of figures){if(typeof src==='string'&&(/^(https:\/\/)/.test(src)||/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=\s]+$/.test(src)))out+=`<div class="fig"><img src="${esc(src)}" alt="${esc(a.figure_caption||'Question diagram')}" style="max-width:100%;height:auto"></div>`;}
  if (a.figspec) out += `<div class="fig">${cleanMarkup(drawFig(a.figspec))}</div>`;
  if (a.html)    out += `<div class="fig fig-table">${cleanMarkup(ent(a.html))}</div>`;
  if(a.svg) out+=`<div class="fig">${cleanMarkup(a.svg)}</div>`;
  if(a.image&&/^https:\/\//.test(a.image))out+=`<div class="fig"><img src="${esc(a.image)}" alt="${esc(a.image_alt || 'Question diagram')}" style="max-width:100%;height:auto"></div>`;
  if((a.source_question||a.source_code) && a.image && /^https:\/\//.test(a.image))out+=`<p style="margin:8px 0 18px;font-size:14px"><a href="${esc(a.image)}" target="_blank" rel="noopener">${a.source_question?'Enlarge original question':'Enlarge diagram'}</a></p>`;
  if(a.source_code)out+=`<p class="dash-note">Source: ${esc(a.source_document||'Question bank')} · ${esc(a.source_code)}</p>`;
  if(a.source_question) {
    const links=[['instructions','Paper instructions'],['reference','Formula reference']].filter(([key])=>typeof a[key]==='string'&&/^https:\/\//.test(a[key])).map(([key,label])=>`<a href="${esc(a[key])}" target="_blank" rel="noopener">${label}</a>`);
    out+=`<p style="font-size:14px;margin:10px 0 18px">${links.join(' · ')}</p>`;
  }
  return out;
}
const fmt = v => v?.void ? 'Excluded from scoring' : Array.isArray(v) ? v.join('  or  ') : (v == null ? '' : String(v));

window.addEventListener('beforeunload', e => {
  if (ST.run && !$('vRun').classList.contains('hidden')) { e.preventDefault(); e.returnValue = ''; }
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  session ? boot() : show('vLogin');
})();
</script>
