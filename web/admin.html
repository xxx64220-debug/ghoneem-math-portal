<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor Console — Abdelrahman Ghoneem</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#14243E;--navy2:#1D3155;--gold:#C9A227;--gold-soft:#F3E8C4;
 --paper:#FBFAF7;--line:#E2E0D9;--ink:#171A1F;--muted:#6B7280;
 --ok:#1F7A4D;--bad:#B0342C;--warn:#B4761F;--r:9px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
h1,h2{font-family:Fraunces,Georgia,serif;color:var(--navy);letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.btn{background:var(--navy);color:#fff;padding:9px 17px;border-radius:var(--r);font-weight:600}
.btn:hover{background:var(--navy2)} .btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 11px;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:500}
.btn-sm:hover{border-color:var(--navy)}

header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{font-family:Fraunces,serif;font-weight:700;color:var(--navy);font-size:16px}
.brand span{display:block;font:500 10px/1 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.15em;margin-top:3px}
.sp{flex:1}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:19}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{padding:12px 15px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}

.login{max-width:370px;margin:12vh auto;padding:0 20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}

main{padding:26px 0 70px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.head h2{font-size:21px} .head .sp{flex:1}
.hint{color:var(--muted);font-size:13.5px}

table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
 border-radius:var(--r);overflow:hidden;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-size:12px;
 font-weight:600;letter-spacing:.03em;white-space:nowrap}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:middle}
tr:nth-child(even) td{background:#F8F9FB}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:500 11px/1 'IBM Plex Mono',monospace;padding:4px 8px;border-radius:5px;background:#F1F0EC;color:var(--muted)}
.pill.ok{background:#E7F2EC;color:var(--ok)} .pill.bad{background:#FBECEB;color:var(--bad)}
.pill.warn{background:#FBF3E3;color:var(--warn)}
.control-bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:0 0 16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px}
.control-bar .field{margin:0;min-width:150px;flex:1}.control-bar .field.search{flex:2;min-width:220px}
.back-to-top{position:fixed;right:18px;bottom:20px;z-index:60;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;box-shadow:0 6px 22px #14243e40;font-weight:700;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}
.back-to-top.show{opacity:1;transform:none;pointer-events:auto}.back-to-top:hover{background:var(--navy2)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--navy)}
.bar i.low{background:var(--bad)} .bar i.mid{background:var(--gold)}
.heatmap th:first-child,.heatmap td:first-child{position:sticky;left:0;z-index:1;background:#fff;min-width:160px}.heatmap th:first-child{z-index:2;background:var(--navy)}
.heatmap th{max-width:150px;white-space:normal;min-width:105px}.heatmap td{text-align:center;min-width:105px}
.heatmap .heat-low{background:#fbeceb;color:#862d28}.heatmap .heat-mid{background:#fbf3e3;color:#795011}.heatmap .heat-high{background:#e7f2ec;color:#17613e}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .k{font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--muted)}
.stat .v{font-family:Fraunces,serif;font-size:29px;color:var(--navy);margin-top:7px;line-height:1}
.msg{padding:10px 13px;border-radius:var(--r);font-size:14px;margin-bottom:12px}
.msg.ok{background:#E7F2EC;color:var(--ok)} .msg.bad{background:#FBECEB;color:var(--bad)}
.empty{color:var(--muted);padding:22px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
footer.pg{border-top:1px solid var(--line);padding:18px 0;text-align:center;font-size:12.5px;color:var(--muted)}
footer.pg b{color:var(--navy)}
@media(max-width:640px){table{font-size:13px}th,td{padding:7px 8px}}
body{font-size:16px}.field label,.hint,.btn-sm,th,.pill,.stat .k{font-size:14px}.table-wrap{overflow-x:auto}.brand span{font-size:12px}textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:100px}dialog{margin:auto;border:1px solid var(--line);border-radius:14px;padding:26px;width:min(760px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#14243e99}dialog h2{margin-bottom:20px}dialog .actions{display:flex;gap:10px;margin-top:20px}label.check{display:flex;align-items:center;gap:10px;padding:7px}label.check input{width:auto}.question-select{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}.question-select label{border-bottom:1px solid var(--line);font-size:14px}#view>table{display:block;overflow-x:auto}a{color:var(--navy)}@media(max-width:640px){header.top .wrap{height:auto;min-height:70px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}nav.tabs{position:static}.brand{max-width:170px}.wrap{padding-left:14px;padding-right:14px}}

.danger{color:#a42620;border-color:#b83b34}.btn.danger{background:#a42620;color:#fff;border-color:#a42620}.delete-warning{line-height:1.7;margin:16px 0 22px;overflow-wrap:anywhere}dialog{max-width:calc(100vw - 28px);max-height:calc(100dvh - 32px);overflow:auto}.actions,.head{flex-wrap:wrap;gap:12px}td .btn-sm{margin:4px 4px 4px 0}.field{margin-bottom:18px}.field label{display:block;margin-bottom:7px}textarea{line-height:1.7}td{line-height:1.6}.stem,.exp{white-space:pre-line;overflow-wrap:anywhere}

main.wrap{padding-top:24px;padding-bottom:64px}#view{min-width:0}.table-wrap{width:100%;max-width:100%;overflow-x:auto;margin-bottom:20px}.table-wrap table{min-width:640px}header.top .wrap{height:auto;min-height:76px;padding-top:12px;padding-bottom:12px}header.top{position:static}nav.tabs{position:sticky;top:0}nav.tabs .wrap{padding-top:4px;padding-bottom:4px}.brand{line-height:1.35}.brand span{line-height:1.4}.stat .k{line-height:1.5;letter-spacing:.06em}.stat .v{line-height:1.2}.msg{line-height:1.75;padding:16px}.dash-link{text-decoration:underline;font-weight:600}.actions{display:flex}.teaching-question{line-height:1.75;margin:22px 0;white-space:pre-line;overflow-wrap:anywhere}.teaching-options{display:grid;gap:12px}.teaching-options button{text-align:left;border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.6}.teaching-options button.selected{border:2px solid var(--navy);background:#edf1f7}.teaching-answer{padding:18px;background:#e7f2ec;margin-top:20px;line-height:1.75;white-space:pre-line}.fig{max-width:100%;overflow-x:auto;margin:18px 0}.fig img,.fig svg{max-width:100%;height:auto}.katex-display{overflow-x:auto;overflow-y:hidden}#editor.teaching{width:min(960px,94vw)}
@media(max-width:640px){header.top .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.brand{grid-column:1/-1;max-width:none;font-size:18px}.brand span{font-size:12px;letter-spacing:.08em}.sp{display:none}#trackSel{min-width:0!important;width:100%!important}#outBtn{min-height:44px}.tab{padding:12px;font-size:14px;min-height:48px}nav.tabs .wrap{padding-left:8px;padding-right:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:16px 12px}.stat .k{font-size:12px}.stat .v{font-size:28px}.head h2{font-size:23px}.btn,.btn-sm{min-height:44px}.card,dialog{padding:18px}.table-wrap th,.table-wrap td{padding:12px;line-height:1.6}.table-wrap{border-radius:9px}.teaching-options button{padding:14px}.teaching .actions button{flex:1}.grid .field{min-width:0}}
@media(max-width:640px){.control-bar{display:grid;grid-template-columns:minmax(0,1fr);padding:12px}.control-bar .field,.control-bar .field.search{min-width:0;width:100%}.control-bar>.btn{width:100%}.head{align-items:flex-start}.head>.btn,.head>.btn-sm{flex:1 1 150px}.question-select{max-height:45vh}dialog{width:calc(100vw - 16px);max-width:none;padding:16px}.back-to-top{right:12px;bottom:12px}.actions>.btn,.actions>.btn-sm{flex:1 1 130px}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>

<body>

<header class="top hidden" id="top"><div class="wrap">
  <div class="brand">Abdelrahman Ghoneem<span>INSTRUCTOR CONSOLE</span></div>
  <div class="sp"></div>
  <select id="trackSel" style="width:auto;min-width:130px"></select>
  <button class="btn-sm" id="outBtn">Sign out</button>
</div></header>

<nav class="tabs hidden" id="tabs"><div class="wrap">
  <button class="tab on" data-v="overview">Overview</button>
  <button class="tab" data-v="students">Students</button>
  <button class="tab" data-v="results">Results</button>
  <button class="tab" data-v="lessons">Class heatmap</button>
  <button class="tab" data-v="questions">Hardest questions</button>
  <button class="tab" data-v="exams">Exams & assignments</button><button class="tab" data-v="bank">Question bank</button><button class="tab" data-v="groups">Groups</button><button class="tab" data-v="devices">Devices</button><button class="tab" data-v="audit">Audit log</button>
</div></nav>

<section id="vLogin" class="login">
  <h1 style="font-size:28px;margin-bottom:5px">Instructor sign in</h1>
  <p class="hint" style="margin-bottom:22px">Staff accounts only.</p>
  <div class="field"><label for="em">Email</label><input id="em" autocomplete="username"></div>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn" id="inBtn" style="width:100%;margin-top:6px">Sign in</button>
  <div class="err" id="loginErr" role="alert"></div><a href="/" style="display:block;margin-top:20px">Student sign in →</a>
</section>

<main class="wrap hidden" id="app"><div id="view"></div></main>
<footer class="pg"><b>Abdelrahman Ghoneem</b> &nbsp;|&nbsp; 01116004434</footer>
<button class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">↑</button>

<dialog id="editor"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
/* ============================ CONFIG ============================ */
const SB_URL = 'https://wfhurjyouemahvkcfkdz.supabase.co';
const SB_KEY = 'sb_publishable_FIUSELOTsAQaH8dQ6oF-ow_CcISJV5-';
const EMAIL_DOMAIN = 'students.ghoneem-math.com';
/* ================================================================ */

const sb = supabase.createClient(SB_URL, SB_KEY);
const fnBase = SB_URL + '/functions/v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ST = { view:'overview', track:'', tracks:[], me:null };
const sortText=(a,b)=>String(a??'').localeCompare(String(b??''),undefined,{numeric:true,sensitivity:'base'});

async function fn(name, { method='POST', body=null } = {}) {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { show(false); throw new Error('signed_out'); }
  const res = await fetch(`${fnBase}/${name}`, { method,
    headers:{ Authorization:`Bearer ${session.access_token}`,
              'Content-Type':'application/json', apikey:SB_KEY },
    body: body ? JSON.stringify(body) : undefined });
  return { ok:res.ok, status:res.status, json: await res.json().catch(()=>({})) };
}
/* Reads go direct: admin and instructor read policies already scope these
   views correctly, so the dashboard needs no extra endpoints. */
const q = (v) => sb.from(v).select('*').throwOnError();

function show(inApp){
  $('vLogin').classList.toggle('hidden', inApp);
  $('app').classList.toggle('hidden', !inApp);
  $('top').classList.toggle('hidden', !inApp);
  $('tabs').classList.toggle('hidden', !inApp);
}
function bar(p){
  const c = p < 50 ? 'low' : p < 75 ? 'mid' : '';
  return `<div class="bar"><i class="${c}" style="width:${Math.max(2,p||0)}%"></i></div>`;
}
const pct = p => p==null ? '—' : p+'%';
const when = t => t ? new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '—';

/* ---------------- auth ---------------- */
$('inBtn').onclick = async () => {
  $('inBtn').disabled = true; $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email:$('em').value.trim(), password:$('pw').value });
  $('inBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Those details did not work.'; return; }
  boot();
};
$('pw').onkeydown = e => { if (e.key==='Enter') $('inBtn').click(); };
$('outBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){show(false);return;}
  const { data:prof } = await sb.from('profiles').select('id,full_name,role,status').eq('id',user.id).single();
  if (!prof || prof.status!=='active' || (prof.role !== 'admin' && prof.role !== 'instructor')) {
    $('loginErr').textContent = 'This console is for staff accounts only.';
    await sb.auth.signOut(); return;
  }
  ST.me = prof;
  const { data:tr } = await sb.from('tracks').select('id,name').order('id');
  ST.tracks = tr || [];
  $('trackSel').innerHTML = `<option value="">All tracks</option>` +
    ST.tracks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  $('trackSel').onchange = e => { ST.track = e.target.value; render(); };
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    ST.view = b.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
  show(true); render();
}

/* ---------------- views ---------------- */
async function render(){
  $('view').innerHTML = `<p class="hint">Loading…</p>`;
  try { await ({ overview, students, results, lessons, questions, exams, bank, groups, devices, audit })[ST.view](); }
  catch (e) { $('view').innerHTML = `<div class="msg bad">Could not load: ${esc(e.message||e)}</div>`; }
}
const trackFilter = (b) => ST.track ? b.eq('track_id', ST.track) : b;

async function overview(){
  const [{data:r},{data:f},{data:x}] = await Promise.all([
    q('roster').eq('role','student'), trackFilter(q('results_feed')), trackFilter(q('exam_overview'))]);
  const done = (f||[]).length;
  const avg = done ? Math.round((f||[]).reduce((s,a)=>s+(a.percent||0),0)/done) : null;
  const unassigned = (x||[]).filter(e=>e.is_published && Number(e.assignments)===0 && !/Demo/.test(e.title)).length;
  $('view').innerHTML = `
    <div class="head"><h2>Overview</h2></div>
    <div class="grid" style="margin-bottom:20px">
      <div class="stat"><div class="k">STUDENTS</div><div class="v">${(r||[]).length}</div></div>
      <div class="stat"><div class="k">COMPLETED ATTEMPTS</div><div class="v">${done}</div></div>
      <div class="stat"><div class="k">AVERAGE</div><div class="v">${avg==null?'—':avg+'%'}</div></div>
      <div class="stat"><div class="k">EXAMS LIVE</div><div class="v">${(x||[]).filter(e=>e.is_published).length}</div></div>
    </div>
    ${unassigned ? `<div class="msg bad">${unassigned} published exam(s) have no assignment — students cannot see them. Open <button class="dash-link" onclick="ST.view='exams';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v==='exams'));render()">Exams & assignments</button> to assign them.</div>`:''}
    <div class="head"><h2 style="font-size:17px">Latest results</h2></div>
    ${tableResults((f||[]).slice(0,8))}`;
}

function tableResults(rows){
  if (!rows.length) return `<div class="empty">No exams have been sat yet.</div>`;
  return `<div class="table-wrap"><table><tr><th>Student</th><th>Exam</th><th>Score</th><th></th><th>Scaled</th><th>When</th></tr>` +
    rows.map(a=>`<tr>
      <td>${esc(a.full_name)}</td><td>${esc(a.exam)}</td>
      <td class="num">${a.score == null ? 'Awaiting grading' : a.score+'/'+a.total}</td>
      <td style="width:110px">${bar(a.percent)}</td>
      <td class="num">${a.scaled_score ?? '<span class="hint">—</span>'}</td>
      <td class="hint">${when(a.submitted_at)}${a.status==='expired'?' <span class="pill warn">TIME OUT</span>':''}</td>
    </tr>`).join('') + `</table></div>`;
}

async function students(){
  const { data:r } = await q('roster').eq('role','student').order('full_name');
  $('view').innerHTML = `
    <div class="head"><h2>Students</h2><div class="sp"></div>
      <button class="btn" id="addBtn">Add student</button></div>
    <div id="addBox" class="card hidden">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div class="field"><label>Username</label><input id="nU" placeholder="omar.h"></div>
        <div class="field"><label>Full name</label><input id="nN" placeholder="Omar Hassan"></div>
        <div class="field"><label>Password</label><input id="nP" placeholder="at least 8 characters"></div>
        <div class="field"><label>Tracks</label>
          <select id="nT">${ST.tracks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
            <option value="__all">Both tracks</option></select></div>
      </div>
      <div id="addMsg"></div>
      <button class="btn" id="saveBtn">Create account</button>
      <button class="btn-sm" id="cancelBtn">Cancel</button>
    </div>
    ${(r||[]).length ? wrapTable(`<table>
      <tr><th>Name</th><th>Sign-in</th><th>Tracks</th><th>Exams</th><th>Last active</th><th>Status</th></tr>` +
      r.map(s=>`<tr><td>${esc(s.full_name)}</td>
        <td class="num hint">${esc((s.email||'').split('@')[0])}</td>
        <td><span class="pill">${esc(s.tracks)}</span></td>
        <td class="num">${s.exams_taken}</td>
        <td class="hint">${when(s.last_active)}</td>
        <td>${s.status==='active'?'<span class="pill ok">ACTIVE</span>':'<span class="pill bad">'+esc(s.status.toUpperCase())+'</span>'}</td>
      </tr>`).join('') + `</table>`)
    : `<div class="empty">No students yet. Use <b>Add student</b> above.</div>`}`;

  $('addBtn').onclick = () => $('addBox').classList.remove('hidden');
  $('cancelBtn').onclick = () => $('addBox').classList.add('hidden');
  $('saveBtn').onclick = async () => {
    const tsel = $('nT').value;
    const tracks = tsel === '__all' ? ST.tracks.map(t=>t.id) : [tsel];
    $('saveBtn').disabled = true;
    const { ok, json } = await fn('admin-users', { body:{
      username:$('nU').value.trim(), full_name:$('nN').value.trim(),
      password:$('nP').value, tracks }});
    $('saveBtn').disabled = false;
    $('addMsg').innerHTML = ok
      ? `<div class="msg ok">Created <b>${esc(json.username)}</b>. They sign in with that username and the password you set.</div>`
      : `<div class="msg bad">${esc(json.error||'Could not create the account.')}</div>`;
    if (ok) { $('nU').value=$('nN').value=$('nP').value=''; setTimeout(students, 1200); }
  };
}

async function results(){
  const { data:f } = await trackFilter(q('results_feed')).order('submitted_at',{ascending:false});
  $('view').innerHTML = `
    <div class="head"><h2>Results</h2><div class="sp"></div>
      <button class="btn-sm" id="csvBtn">Export CSV</button></div>
    <p class="hint" style="margin-bottom:12px">A scaled 200–800 score appears only on full-length papers.
      Lesson drills show the raw mark, because scaling a 15-question quiz to an SAT score would be misleading.</p>
    ${wrapTable(tableRetake(f||[]))}`;
  $('csvBtn').onclick = () => csv(f||[], 'results');

function csv(rows, name){
  if (!rows.length) return;
  const cols = Object.keys(rows[0]);
  const cell = v => `"${String(v ?? '').replace(/^[=+@-]/,x=>"'"+x).replace(/"/g,'""')}"`;
  const body = '\ufeff' + [cols.join(',')].concat(rows.map(r => cols.map(c => cell(r[c])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], {type:'text/csv'}));
  a.download = `${name}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function getRows(table,track=false,columns='*',orderBy='',eqField='',eqValue=''){

 return rows;

 $('view').innerHTML=`<div class="head"><h2>Exams & assignments</h2><span class="hint">${rows.length} exams available to you</span><div class="sp"></div><button class="btn" id="newExam">Create exam</button></div><div class="control-bar"><div class="field"><label for="examTrack">Track</label><select id="examTrack"><option value="">All tracks</option>${ST.tracks.map(t=>`<option value="${esc(t.id)}" ${ST.track===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field search"><label for="examSearch">Search exams</label><input id="examSearch" placeholder="Exam title"></div><div class="field"><label for="examType">Category</label><select id="examType"><option value="">All categories</option><option value="lesson_exam">Lesson exams</option><option value="quiz">Quizzes</option><option value="full_exam">Full exams</option></select></div><div class="field"><label for="examStatus">Availability</label><select id="examStatus"><option value="">All exams</option><option value="live">Published</option><option value="draft">Draft</option><option value="assigned">Assigned</option><option value="unassigned">Not assigned</option></select></div><div class="field"><label for="examSort">Sort by</label><select id="examSort"><option value="title">Title A–Z</option><option value="track">Track then title</option><option value="category">Category then title</option><option value="questions_desc">Most questions</option><option value="newest">Newest created</option></select></div></div><p id="examCount" class="hint" style="margin-bottom:12px"></p><div id="examTable"></div><p class="hint" style="margin-top:16px">Publish an exam and assign it to a student or group. A closing time delays worked answers until the window ends. EST is calculator-allowed throughout. Full papers use raw marks until an exact score conversion is provided.</p>`;
 const paint=()=>{const track=val('examTrack'),needle=val('examSearch').toLowerCase(),type=val('examType'),status=val('examStatus'),sort=val('examSort');const shown=rows.filter(x=>{const n=assignments.filter(a=>a.exam_id===x.id).length;return(!track||x.track_id===track)&&x.title.toLowerCase().includes(needle)&&(!type||x.assessment_type===type)&&(!status||(status==='live'?x.is_published:status==='draft'?!x.is_published:status==='assigned'?n>0:n===0));}).sort((a,b)=>sort==='track'?sortText(a.track_id,b.track_id)||sortText(a.title,b.title):sort==='category'?sortText(categoryName[a.assessment_type],categoryName[b.assessment_type])||sortText(a.title,b.title):sort==='questions_desc'?b.question_ids.length-a.question_ids.length:sort==='newest'?sortText(b.created_at,a.created_at):sortText(a.title,b.title));$('examCount').textContent=`${shown.length} of ${rows.length} exams shown`;$('examTable').innerHTML=wrapTable(`<table><thead><tr><th>Track</th><th>Exam</th><th>Category</th><th>Questions</th><th>Minutes</th><th>Assignments</th><th>Status</th><th>Actions</th></tr></thead><tbody>${shown.map(x=>`<tr><td>${esc(x.track_id.toUpperCase())}</td><td>${esc(x.title)}</td><td><select aria-label="Category for ${esc(x.title)}" data-classify="${x.id}">${Object.entries(categoryName).map(([v,t])=>`<option value="${v}" ${x.assessment_type===v?'selected':''}>${t}</option>`).join('')}</select></td><td>${x.question_ids.length}</td><td>${Math.round(x.duration_seconds/60)}</td><td>${assignments.filter(a=>a.exam_id===x.id).length}</td><td><span class="pill ${x.is_published?'ok':''}">${x.is_published?'Published':'Draft'}</span></td><td><button class="btn-sm" data-ex-practice="${x.id}">Teach / practise — no timer</button> <button class="btn-sm" data-ex-edit="${x.id}">Edit</button> <button class="btn-sm" data-ex-assign="${x.id}">Assign</button> <button class="btn-sm" data-ex-progress="${x.id}">Progress</button> <button class="btn-sm" data-ex-pub="${x.id}">${x.is_published?'Unpublish':'Publish'}</button> <button class="btn-sm" data-ex-release="${x.id}">Release review</button></td></tr>`).join('')}</tbody></table>`);bind();};
 const bind=()=>{
 $('newExam').onclick=()=>editExam();
 document.querySelectorAll('[data-ex-practice]').forEach(b=>b.onclick=()=>openTeachingExam(rows.find(x=>x.id===b.dataset.exPractice)));
 document.querySelectorAll('[data-classify]').forEach(b=>b.onchange=async()=>{b.disabled=true;try{await mutation('exam.classify',{id:b.dataset.classify,assessment_type:b.value});}catch(e){alert(e.message);await render();}finally{b.disabled=false;}});
 document.querySelectorAll('[data-ex-edit]').forEach(b=>b.onclick=()=>editExam(rows.find(x=>x.id===b.dataset.exEdit)));
 document.querySelectorAll('[data-ex-assign]').forEach(b=>b.onclick=()=>assignExam(rows.find(x=>x.id===b.dataset.exAssign),assignments));
 document.querySelectorAll('[data-ex-progress]').forEach(b=>b.onclick=()=>assignmentProgress(rows.find(x=>x.id===b.dataset.exProgress),assignments));
 document.querySelectorAll('[data-ex-pub]').forEach(b=>b.onclick=async()=>{try{const x=rows.find(x=>x.id===b.dataset.exPub);await mutation('exam.save',{id:x.id,is_published:!x.is_published});await render();}catch(e){alert(e.message);}});
 document.querySelectorAll('[data-ex-release]').forEach(b=>b.onclick=async()=>{if(!confirm('Release worked answers for completed attempts?'))return;try{await mutation('review.release',{exam_id:b.dataset.exRelease});await render();}catch(e){alert(e.message);}});
 };
 $('examTrack').onchange=paint;$('examSearch').oninput=paint;$('examType').onchange=paint;$('examStatus').onchange=paint;$('examSort').onchange=paint;paint();
}
async function editExam(x={},initialQuestionIds=[]){
 const questions=await getRows('questions');
 dialog(x.id?'Edit exam':'Create exam',select('et','Track',tracks(),x.track_id||ST.track)+field('etitle','Exam title',x.title)+field('emins','Duration in minutes',x.duration_seconds?x.duration_seconds/60:25,'number')+select('ereview','Review policy',[['full_review','Full answers after submission or window close'],['score_only','Score only'],['instructor_release','Release answers manually']],x.review_policy)+select('etype','Assessment category',[['lesson_exam','Lesson exam'],['quiz','Quiz'],['full_exam','Full exam']],x.assessment_type||(x.is_full_length?'full_exam':'lesson_exam'))+area('emap','Exact raw-to-scaled conversion (optional JSON)',x.scoring_map?JSON.stringify(x.scoring_map):'')+`<div class="field"><label for="efilter">Find questions</label><input id="efilter" placeholder="Topic or question text"></div><p id="eselected" class="hint"></p><div class="question-select" id="eqs"></div>`,async()=>{
 await mutation('exam.save',{id:x.id,track_id:val('et'),title:val('etitle'),duration_seconds:Math.round(Number(val('emins'))*60),question_ids:[...selected],is_full_length:val('etype')==='full_exam',assessment_type:val('etype'),scoring_map:jval('emap'),review_policy:val('ereview'),is_published:x.is_published||false});
 });
 let selected=new Set((x.question_ids&&x.question_ids.length)?x.question_ids:initialQuestionIds);
 const paint=()=>{
  const needle=val('efilter').toLowerCase();
  const matches=questions.filter(q=>q.track_id===val('et')&&(q.topic+' '+q.stem).toLowerCase().includes(needle));
  const visible=[...matches].sort((a,b)=>Number(selected.has(b.id))-Number(selected.has(a.id))).slice(0,250);
  $('eqs').innerHTML=visible.map(q=>`<label class="check"><input type="checkbox" data-qid="${q.id}" ${selected.has(q.id)?'checked':''}><span><b>${esc(q.topic)}</b> · ${esc(q.stem.slice(0,180))}</span></label>`).join('');
  const note=matches.length>visible.length?` · showing ${visible.length} of ${matches.length}; search to narrow`:'';
  $('eselected').textContent=selected.size+' questions selected'+note;
  $('eqs').querySelectorAll('input').forEach(b=>b.onchange=()=>{b.checked?selected.add(b.dataset.qid):selected.delete(b.dataset.qid);paint();});
 };
 $('et').onchange=()=>{selected.clear();paint();};$('efilter').oninput=paint;if(x.id)$('et').disabled=true;paint();
}
async function assignExam(ex,assignments){
 const [roster,gs]=await Promise.all([getRows('roster'),getRows('groups')]);
 const options=[...gs.filter(g=>g.track_id===ex.track_id).map(g=>['g:'+g.id,'Group: '+g.name]),...roster.filter(r=>r.role==='student'&&r.tracks.split(', ').includes(ex.track_id)).map(r=>['u:'+r.user_id,'Student: '+(r.full_name||r.email)])];
 if(!options.length){alert('Enrol a student or create a group in this track first.');return;}
 const existing=assignments.filter(a=>a.exam_id===ex.id);
 dialog('Assign '+esc(ex.title),select('atarget','Assign to',options)+field('aopen','Opens at (your local time)','','datetime-local')+field('aclose','Closes at (your local time; optional)','','datetime-local')+`<p class="hint">Leave times blank for a self-paced assignment. ${existing.length} assignment(s) already exist for this exam.</p>`,async()=>{
 const [type,id]=val('atarget').split(':');await mutation('assignment.save',{exam_id:ex.id,user_id:type==='u'?id:null,group_id:type==='g'?id:null,open_at:val('aopen')?new Date(val('aopen')).toISOString():null,close_at:val('aclose')?new Date(val('aclose')).toISOString():null});
 },'Assign exam');
}
async function assignmentProgress(ex,assignments){
 const relevant=assignments.filter(a=>a.exam_id===ex.id);
 const [roster,members,attempts]=await Promise.all([getRows('roster'),getRows('group_members'),getRows('attempts',false,'user_id,exam_id,status,started_at,submitted_at','','exam_id',ex.id)]);
 const people=new Map(roster.map(r=>[r.user_id,r]));
 const entries=new Map();
 for(const assignment of relevant){
  const ids=assignment.user_id?[assignment.user_id]:members.filter(m=>m.group_id===assignment.group_id).map(m=>m.user_id);
  for(const id of ids){if(!people.has(id))continue;const list=entries.get(id)||[];list.push(assignment);entries.set(id,list);}
 }
 const attemptByUser=new Map();
 for(const attempt of attempts.filter(a=>a.exam_id===ex.id)){
  const prior=attemptByUser.get(attempt.user_id);
  if(!prior||new Date(attempt.started_at)>new Date(prior.started_at))attemptByUser.set(attempt.user_id,attempt);
 }
 const order={'Not started':0,'In progress':1,'Completed':2};
 const rows=[...entries].map(([id,as])=>{
  const a=attemptByUser.get(id);
  const state=!a?'Not started':a.status==='in_progress'?'In progress':'Completed';
  const close=as.map(x=>x.close_at).filter(Boolean).sort()[0];
  return {name:people.get(id).full_name||people.get(id).email,state,close};
 }).sort((a,b)=>order[a.state]-order[b.state]||sortText(a.name,b.name));
 $('editor').innerHTML=`<h2>Assignment progress · ${esc(ex.title)}</h2><p class="hint" style="margin-bottom:14px">Current group members and directly assigned students. Starts on this exam count, including retakes.</p>${rows.length?wrapTable(`<table><thead><tr><th>Student</th><th>Status</th><th>Deadline</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="pill ${r.state==='Completed'?'ok':r.state==='Not started'?'warn':''}">${r.state}</span></td><td>${r.close?esc(new Date(r.close).toLocaleString()):'No deadline'}</td></tr>`).join('')}</tbody></table>`):'<div class="empty">This exam has no current assigned students.</div>'}<div class="actions"><button class="btn-sm" id="progressClose">Close</button></div>`;
 $('progressClose').onclick=()=>$('editor').close();$('editor').showModal();
}
async function students(){
 const all=await getRows('roster'),rows=ST.track?all.filter(x=>x.tracks.split(', ').includes(ST.track)):all;
 $('view').innerHTML=`<div class="head"><h2>Accounts</h2><div class="sp"></div>${ST.me.role==='admin'?'<button class="btn" id="addAccount">Create account</button>':''}</div>${wrapTable(`<table><thead><tr><th>Name</th><th>Sign-in email</th><th>Role</th><th>Tracks</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.full_name||'Unnamed student')}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${esc(x.tracks)}</td><td>${esc(x.status)}</td><td>${ST.me.role==='admin'?`<button class="btn-sm" data-user="${x.user_id}">Manage</button> ${x.role!=='admin'&&x.user_id!==ST.me.id?`<button class="btn-sm danger" data-delete-user="${x.user_id}">Delete</button>`:''}`:''}</td></tr>`).join('')}</tbody></table>`)}`;
 if($('addAccount'))$('addAccount').onclick=()=>dialog('Create account',field('uname','Username or email')+field('ufull','Full name')+field('upass','Initial password (at least 8 characters)','','password')+select('urole','Role',[['student','Student'],['instructor','Instructor'],['admin','Admin']])+`<p class="hint">Student enrollment</p>`+ST.tracks.map(t=>`<label class="check"><input type="checkbox" data-enroll="${t.id}">${esc(t.name)}</label>`).join(''),async()=>{
 const u=val('uname'),selected=[...document.querySelectorAll('[data-enroll]:checked')].map(b=>b.dataset.enroll);const res=await fn('admin-users',{body:{username:u.includes('@')?'':u,email:u.includes('@')?u:undefined,full_name:val('ufull'),password:$('upass').value,role:val('urole'),tracks:val('urole')==='student'?selected:[]}});if(!res.ok)throw new Error(res.json.error);if(val('urole')==='instructor'&&selected.length)await mutation('instructor.tracks',{id:res.json.user_id,tracks:selected});
 },'Create account');
 document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>manageUser(rows.find(x=>x.user_id===b.dataset.user)));
 document.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>deleteAccount(rows.find(x=>x.user_id===b.dataset.deleteUser)));
}
function deleteAccount(u){
 if(ST.me.role!=='admin'||u.role==='admin'||u.user_id===ST.me.id)return;
 dialog('Delete account',`<p class="delete-warning">Permanently delete <b>${esc(u.full_name||u.email)}</b> (${esc(u.email)})? This removes their sign-in, exam attempts, results, enrollments and daily progress. This cannot be undone. Published exams and question-bank content are kept.</p>`+field('deleteEmail','Type the exact sign-in email to confirm'),async()=>{
  if(val('deleteEmail')!==u.email)throw new Error('Enter the exact sign-in email shown above.');
  const r=await fn('admin-delete-user',{body:{user_id:u.user_id,confirmation:val('deleteEmail')}});
  if(!r.ok){const messages={admin_required:'Only active administrators can delete accounts.',protected_account:'Administrator accounts cannot be deleted.',confirmation_mismatch:'The confirmation email does not match.',user_not_found:'This account no longer exists.'};throw new Error(messages[r.json.error]||'Unable to delete this account. Refresh and try again.');}
 },'Permanently delete account');
 $('editSave').classList.add('danger');
}
async function manageUser(u){
 dialog('Manage account',field('mname','Full name',u.full_name)+select('mrole','Role',[['student','Student'],['instructor','Instructor'],['admin','Admin']],u.role)+select('mstatus','Status',[['active','Active'],['suspended','Suspended']],u.status)+`<p class="hint">Track access</p>`+ST.tracks.map(t=>`<label class="check"><input type="checkbox" data-track="${t.id}" ${u.tracks.split(', ').includes(t.id)?'checked':''}>${esc(t.name)}</label>`).join(''),async()=>{
 await mutation('user.update',{id:u.user_id,full_name:val('mname'),role:val('mrole'),status:val('mstatus')});
 const sels=[...document.querySelectorAll('[data-track]')];
 if(val('mrole')==='instructor')await mutation('instructor.tracks',{id:u.user_id,tracks:sels.filter(b=>b.checked).map(b=>b.dataset.track)});
 else if(val('mrole')==='student')for(const b of sels)await mutation('enrollment.save',{user_id:u.user_id,track_id:b.dataset.track,status:b.checked?'active':'paused'});
 });
 if(u.role==='instructor'){const {data}=await q('instructor_tracks').eq('user_id',u.user_id);document.querySelectorAll('[data-track]').forEach(b=>b.checked=(data||[]).some(t=>t.track_id===b.dataset.track));}
}
async function groups(){
 const rows=await getRows('groups',true),roster=await getRows('roster'),members=await getRows('group_members');
 $('view').innerHTML=`<div class="head"><h2>Groups</h2><div class="sp"></div><button class="btn" id="newGroup">Create group</button></div>${wrapTable(`<table><tr><th>Group</th><th>Track</th><th>Members</th><th></th></tr>${rows.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.track_id)}</td><td>${members.filter(m=>m.group_id===g.id).length}</td><td><button class="btn-sm" data-group="${g.id}">Manage</button></td></tr>`).join('')}</table>`)}`;

 $('newGroup').onclick=()=>edit();document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>edit(rows.find(g=>g.id===b.dataset.group)));
